<body>
    <header class="encabezado-principal">
        <div style="display: flex; align-items: center; gap: 15px;">
            <nav>
                <a href="./index.html">
                    <img src="./recusos/imagenes/consultora_200x200.jpeg" alt="Logo de la consultora" style="height: 50px; width: auto;">

            <h1 style="margin: 0;">Sofía Rossi | Consultora de Comunicación Digital</h1>

    <main class="contenido-principal">
        <h2>Contacto</h2>
        <h3>Escribinos</h3>
        <form action="./contacto.html" method="post">
            <label for="id-nombre">nombre</label>
            <input type="text" name="nombre" id="id-nombre">
            <label for="id-mail"> mail</label>
            <input type="email" name="mail" id="id-mail">
            <label for="id-numero">numero</label>
            <input type="number" name="numero" id="id_numero">

            <label for="id-tipo-de-servicio">Tipo de Servicio</label>
             <select name="tipo-servicio" id="id-tipo-de-servicio">
                <option value="auditoria">Auditoria</option>
                <option value="gestion-de-publicidad">Gestion de Publicidad</option>
                <option value="estrategia">Estrategia</option>
             </select>
                  
            <label for="id-comentario">comentario</label>
            <textarea name="comentario" id="id-comentario">
                comentario
            </textarea>
            <button type="button">
                Enviar
            </button>
        </form>

    </main>

    <footer class="pie-principal">
