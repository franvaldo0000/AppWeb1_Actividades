<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Sofía Martínez</title>
</head>
<body>
    <h1>Contacto</h1>
    
    <p>
        <a href="index.html">Quién soy / Servicios</a> | 
        <a href="contacto.html">Contacto</a>
    </p>

    <p>¿Tenés un proyecto en mente o querés renovar la imagen de tu negocio? Completá el siguiente formulario con tus datos y el detalle de lo que necesitás. Te responderé a la brevedad para coordinar una reunión.</p>

    <form>
        <p>
            <label for="nombre">Nombre y apellido:</label><br>
            <input type="text" id="nombre" name="nombre">
        </p>

        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="telefono">Teléfono o WhatsApp:</label><br>
            <input type="text" id="telefono" name="telefono">
        </p>

        <p>
            <label for="servicio">Servicio de interés:</label><br>
            <select id="servicio" name="servicio">
                <option value="identidad">Identidad Visual</option>
                <option value="packaging">Diseño de Packaging</option>
                <option value="consultoria">Consultoría de Marca</option>
                <option value="otro">Otro</option>
            </select>
        </p>

        <p>
            <label for="mensaje">Mensaje o detalles del proyecto:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
        </p>

        <p>
            <button type="submit">Enviar consulta</button>
        </p>
    </form>
</body>
</html>
